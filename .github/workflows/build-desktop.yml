name: Build Desktop Apps

on:
  pull_request:
    paths:
      - "videocaptioner/**"
      - "resource/**"
      - "scripts/build_desktop.py"
      - "scripts/smoke_desktop.py"
      - "NovaCaption.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build desktop bundle
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          uv run --with pyinstaller --with static-ffmpeg python scripts/build_desktop.py --clean 2>&1 |
            Tee-Object -FilePath build-desktop.log
          exit $LASTEXITCODE

      - name: Report desktop build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = Get-Content build-desktop.log -Tail 25
          "### Desktop build failure" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          $tail >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $annotation = (($tail -join "`n").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A"))
          Write-Output "::error title=Desktop build failed::$annotation"
          exit 1

      - name: Smoke test packaged app
        run: uv run python scripts/smoke_desktop.py dist/NovaCaption

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: novacaption-${{ runner.os }}
          path: |
            artifacts/VideoCaptioner-Setup-x64.exe
            artifacts/VideoCaptioner-macOS-AppleSilicon.dmg
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" artifacts/*.zip --clobber
